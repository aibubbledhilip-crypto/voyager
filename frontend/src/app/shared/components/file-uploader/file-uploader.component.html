<div class="file-uploader">
  <div class="upload-area"
       [class.dragging]="isDragging"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)"
       (click)="fileInput.click()">
    <mat-icon class="upload-icon">cloud_upload</mat-icon>
    <p class="upload-title">Drag & Drop files here</p>
    <p class="upload-subtitle">or click to browse</p>
    <p class="upload-info">Accepted: {{ accept }} | Max size: {{ maxSize | fileSize }}</p>
  </div>

  <input #fileInput
         type="file"
         [accept]="accept"
         [multiple]="multiple"
         (change)="onFileSelect($event)"
         style="display: none">

  <div class="selected-files" *ngIf="selectedFiles.length > 0">
    <div class="files-header">
      <h3>Selected Files ({{ selectedFiles.length }})</h3>
      <button mat-button color="warn" (click)="clearFiles()">
        <mat-icon>delete</mat-icon>
        Clear All
      </button>
    </div>

    <div class="file-list">
      <div class="file-item" *ngFor="let file of selectedFiles; let i = index">
        <mat-icon class="file-icon">insert_drive_file</mat-icon>
        <div class="file-details">
          <div class="file-name">{{ file.name }}</div>
          <div class="file-size">{{ file.size | fileSize }}</div>
        </div>
        <button mat-icon-button (click)="removeFile(i)" color="warn">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>

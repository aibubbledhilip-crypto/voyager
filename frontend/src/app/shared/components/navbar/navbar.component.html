<mat-toolbar class="navbar">
  <div class="navbar-content">
    <div class="navbar-left">
      <button mat-button class="logo-btn" routerLink="/dashboard">
        <mat-icon>rocket_launch</mat-icon>
        <span class="app-name">voyager</span>
      </button>

      <div class="nav-links">
        <button mat-button routerLink="/dashboard" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          Dashboard
        </button>
        <!-- <button mat-button routerLink="/data-analysis" routerLinkActive="active">
          <mat-icon>analytics</mat-icon>
          Data Analysis
        </button> -->
        <button mat-button routerLink="/athena" routerLinkActive="active">
          <mat-icon>search</mat-icon>
          SQL Athena
        </button>
        <!-- <button mat-button *ngIf="authService.isAdmin" routerLink="/admin" routerLinkActive="active">
          <mat-icon>settings</mat-icon>
          Admin
        </button> -->
      </div>
    </div>

    <div class="navbar-right">
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info">
          <div class="user-name">{{ currentUser?.username }}</div>
          <div class="user-email">{{ currentUser?.email }}</div>
          <div class="user-role" *ngIf="currentUser?.is_admin">Administrator</div>
          <div class="user-role" *ngIf="!currentUser?.is_admin">Member</div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>

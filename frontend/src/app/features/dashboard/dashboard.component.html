<div class="dashboard-container">
  <div class="dashboard-header">
    <h1 class="title">
      <mat-icon class="title-icon">dashboard</mat-icon>
      Welcome to voyager
    </h1>
    <p class="subtitle">Select a module to get started</p>
  </div>

  <div class="modules-grid">
    <mat-card
      *ngFor="let module of visibleModules"
      class="module-card"
      [class.coming-soon]="module.comingSoon"
      [class.clickable]="!module.comingSoon"
      (click)="navigateToModule(module)">

      <mat-card-header>
        <div class="module-icon-wrapper">
          <mat-icon class="module-icon">{{ module.icon }}</mat-icon>
        </div>
        <mat-card-title>{{ module.title }}</mat-card-title>
        <mat-chip
          [class]="getBadgeClass(module.badgeColor)"
          class="module-badge">
          {{ module.badge }}
        </mat-chip>
      </mat-card-header>

      <mat-card-content>
        <p class="module-description">{{ module.description }}</p>

        <div class="features-list">
          <div class="feature-item" *ngFor="let feature of module.features">
            <mat-icon class="feature-icon">check_circle</mat-icon>
            <span>{{ feature }}</span>
          </div>
        </div>
      </mat-card-content>

      <mat-card-actions *ngIf="!module.comingSoon">
        <button mat-raised-button color="primary" class="launch-btn">
          <mat-icon>launch</mat-icon>
          Launch Module
        </button>
      </mat-card-actions>

      <mat-card-actions *ngIf="module.comingSoon">
        <button mat-stroked-button disabled class="coming-soon-btn">
          <mat-icon>schedule</mat-icon>
          Coming Soon
        </button>
      </mat-card-actions>

      <div class="coming-soon-overlay" *ngIf="module.comingSoon">
        <mat-icon class="overlay-icon">schedule</mat-icon>
        <span class="overlay-text">Coming Soon</span>
      </div>
    </mat-card>
  </div>

  <div class="powered-by">
    <span>Powered by</span>
    <img src="assets/prodapt-logo.png" alt="Prodapt">
  </div>
</div>
